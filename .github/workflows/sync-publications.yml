name: Sync publications

# Every Monday 06:00 UTC, plus a "Run workflow" button on the Actions tab
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new publications and metrics
        run: python scripts/sync_publications.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "publication-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Weekly publication sync"
            git push
          else
            echo "Nothing new this week."
          fi
